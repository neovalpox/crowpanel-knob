; CrowPanel Knob : macro-pad rond (molette + tactile) piloté par knob_companion.py
[env:knob]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; PSRAM octale (ESP32-S3R8) : images caméra/lanceur, la RAM interne reste au Wi-Fi
board_build.arduino.memory_type = qio_opi
; USB natif en TinyUSB, démarré à la main (PID propre, voir hw.cpp)
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    adafruit/Adafruit NeoPixel@^1.12.0
    lvgl/lvgl@8.3.11
; reset 1200 bauds sur le CDC TinyUSB, puis flash via le port du bootloader
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
upload_port = COM37
monitor_port = COM37
monitor_speed = 115200
extra_scripts = post:post_upload.py
